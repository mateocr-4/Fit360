<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="50%" stop-color="#121628" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="gradEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="gradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa114f" />
      <stop offset="100%" stop-color="#ff5277" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#gradBg)" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  
  <!-- Outer Energy Activity Arc (Apple Fitness Move Ring style) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(250, 17, 79, 0.15)" stroke-width="26" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gradApple)" stroke-width="26" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="180" filter="url(#glow)" />

  <!-- Middle Cardio / Nutri Arc -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(0, 245, 155, 0.15)" stroke-width="22" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gradEnergy)" stroke-width="22" stroke-linecap="round" stroke-dasharray="650" stroke-dashoffset="120" filter="url(#glow)" />

  <!-- Center Gym Dumbbell Icon -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="238" y="160" width="36" height="192" rx="12" fill="#ffffff" />
    <!-- Weight plates left -->
    <rect x="210" y="140" width="92" height="32" rx="10" fill="url(#gradCyan)" />
    <rect x="220" y="112" width="72" height="24" rx="8" fill="url(#gradCyan)" />
    <!-- Weight plates right -->
    <rect x="210" y="340" width="92" height="32" rx="10" fill="url(#gradCyan)" />
    <rect x="220" y="376" width="72" height="24" rx="8" fill="url(#gradCyan)" />
  </g>

  <!-- Brand Text "360" -->
  <circle cx="380" cy="380" r="48" fill="#0d111e" stroke="url(#gradCyan)" stroke-width="4" filter="url(#glow)" />
  <text x="380" y="388" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#00f2fe" text-anchor="middle" dominant-baseline="middle">360°</text>
</svg>
